<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementation Browser - Awesome LLD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism.min.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #1f2937;
        background: #f8fafc;
      }

      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.5rem;
        color: white;
        background: #2563eb;
      }

      header a {
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      header h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 500;
      }

      main {
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
        min-height: calc(100vh - 58px);
      }

      nav {
        padding: 1rem;
        overflow: auto;
        border-right: 1px solid #dbe3ef;
        background: white;
      }

      #path {
        margin: 0 0 0.75rem;
        overflow-wrap: anywhere;
        color: #475569;
        font-size: 0.85rem;
      }

      #entries {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #entries a {
        display: block;
        padding: 0.45rem 0.6rem;
        border-radius: 0.35rem;
        color: #1e40af;
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      #entries a:hover {
        background: #eff6ff;
      }

      article {
        min-width: 0;
        padding: 1.5rem;
        overflow: auto;
      }

      #file-title {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }

      pre[class*="language-"] {
        margin: 0;
        border: 1px solid #dbe3ef;
        border-radius: 0.5rem;
        background: white;
      }

      #message {
        color: #64748b;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        nav {
          max-height: 40vh;
          border-right: 0;
          border-bottom: 1px solid #dbe3ef;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./">← Study guide</a>
      <h1>Implementation Browser</h1>
    </header>
    <main>
      <nav>
        <p id="path"></p>
        <ul id="entries"></ul>
      </nav>
      <article>
        <h2 id="file-title">Select a source file</h2>
        <p id="message">Choose a file from the implementation folder.</p>
        <pre id="source-container" hidden><code id="source"></code></pre>
      </article>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markup.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
    <script>
      const extensionLanguages = {
        c: 'c',
        cc: 'cpp',
        cpp: 'cpp',
        cs: 'csharp',
        go: 'go',
        h: 'c',
        hpp: 'cpp',
        java: 'java',
        js: 'javascript',
        md: 'markdown',
        py: 'python',
        rs: 'rust',
        ts: 'typescript'
      };

      const entriesElement = document.querySelector('#entries');
      const pathElement = document.querySelector('#path');
      const titleElement = document.querySelector('#file-title');
      const messageElement = document.querySelector('#message');
      const sourceContainer = document.querySelector('#source-container');
      const sourceElement = document.querySelector('#source');
      const siteRoot = new URL('./', location.href);
      const sourceFilesPromise = fetch(new URL('_source-files.json', siteRoot))
        .then(response => {
          if (!response.ok) {
            throw new Error(`Unable to load the source index (${response.status}).`);
          }
          return response.json();
        });

      function normalizePath(path) {
        const normalized = path.replaceAll('\\', '/').replace(/^\/+/, '');
        if (!normalized.startsWith('solutions/')) {
          throw new Error('Only implementation folders under solutions/ can be browsed.');
        }
        return normalized;
      }

      function setLocation(path) {
        const url = new URL(location.href);
        url.searchParams.set('path', path);
        history.pushState({}, '', url);
        load(path);
      }

      async function loadDirectory(path) {
        const directoryPath = path.endsWith('/') ? path : `${path}/`;
        const sourceFiles = await sourceFilesPromise;
        const entries = new Map();

        for (const sourceFile of sourceFiles) {
          if (!sourceFile.startsWith(directoryPath)) {
            continue;
          }

          const remainder = sourceFile.slice(directoryPath.length);
          const separatorIndex = remainder.indexOf('/');
          const name = separatorIndex === -1 ? remainder : remainder.slice(0, separatorIndex + 1);
          if (name) {
            entries.set(name, directoryPath + name);
          }
        }

        pathElement.textContent = directoryPath;
        entriesElement.replaceChildren();

        const parentPath = directoryPath.replace(/[^/]+\/$/, '');
        if (parentPath.startsWith('solutions/')) {
          addEntry('📁 ..', parentPath);
        }

        for (const [name, entryPath] of [...entries].sort(([left], [right]) => left.localeCompare(right))) {
          addEntry(`${name.endsWith('/') ? '📁' : '📄'} ${name}`, entryPath);
        }
      }

      function addEntry(label, path) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `?path=${encodeURIComponent(path)}`;
        link.textContent = label;
        link.addEventListener('click', event => {
          event.preventDefault();
          setLocation(path);
        });
        item.append(link);
        entriesElement.append(item);
      }

      async function loadFile(path) {
        const response = await fetch(new URL(path, siteRoot));
        if (!response.ok) {
          throw new Error(`Unable to open ${path} (${response.status}).`);
        }

        const extension = path.split('.').pop().toLowerCase();
        const language = extensionLanguages[extension] || 'clike';
        const source = await response.text();

        pathElement.textContent = path.replace(/[^/]+$/, '');
        titleElement.textContent = path.split('/').pop();
        messageElement.hidden = true;
        sourceContainer.hidden = false;
        sourceContainer.className = `language-${language}`;
        sourceElement.className = `language-${language}`;
        sourceElement.textContent = source;
        Prism.highlightElement(sourceElement);
      }

      async function load(requestedPath) {
        try {
          const path = normalizePath(requestedPath);
          titleElement.textContent = path.endsWith('/') ? 'Select a source file' : 'Loading...';
          messageElement.hidden = false;
          messageElement.textContent = 'Loading implementation...';
          sourceContainer.hidden = true;

          if (path.endsWith('/')) {
            await loadDirectory(path);
            titleElement.textContent = 'Select a source file';
            messageElement.textContent = 'Choose a file from the implementation folder.';
          } else {
            await loadFile(path);
          }
        } catch (error) {
          titleElement.textContent = 'Unable to load implementation';
          messageElement.hidden = false;
          messageElement.textContent = error.message;
          sourceContainer.hidden = true;
        }
      }

      addEventListener('popstate', () => load(new URL(location.href).searchParams.get('path') || 'solutions/'));
      load(new URL(location.href).searchParams.get('path') || 'solutions/');
    </script>
  </body>
</html>
